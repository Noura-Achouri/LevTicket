services:
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    container_name: bidpass-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bidpass
      TZ: UTC

    ports:
      - "3306:3306"

    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidpass-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data: