server:
  port: 8080

spring:
  mvc:
    async:
      request-timeout: 60000

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:bidpass}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    serialization:
      fail-on-empty-beans: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.leviathan.bidpass.entity
  configuration:
    map-underscore-to-camel-case: true

gemini:
  api:
    key: "${GEMINI_API_KEY:}"
    url: "${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}"

ai:
  chat:
    base-url: "${AI_CHAT_BASE_URL:https://open.bigmodel.cn/api/paas/v4}"
    api-key: "${AI_CHAT_API_KEY:}"
    model: "${AI_CHAT_MODEL:glm-4-flash}"
    vision-model: "${AI_CHAT_VISION_MODEL:glm-4v-flash}"